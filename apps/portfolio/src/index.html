<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Alysson Mascarenhas · Front-end Engineer</title>
    <meta
      name="description"
      content="Portfólio interativo de engenharia front-end com Angular."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#f7f8fa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d1117"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Aplica o tema escuro antes da primeira pintura, para não piscar (ver LayoutService).
      (function () {
        try {
          var t = localStorage.getItem('portfolio.theme');
          var dark = t
            ? t === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('app-dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <pf-root></pf-root>
  </body>
</html>
